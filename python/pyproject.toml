[project]
name = "syrinx-plugin"
version = "1.0.0"
description = "Write a Syrinx music plugin in a few lines (protocol version 1)"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "../README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["syrinx_plugin"]
